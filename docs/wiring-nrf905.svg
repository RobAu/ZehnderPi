<line x1="500" y1="518" x2="360" y2="518" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
<rect x="260" y="503" width="100" height="30" rx="6" fill="#1a1a1a" stroke="#111" stroke-width="1.5"/>
<text x="310" y="523" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">GND</text>
