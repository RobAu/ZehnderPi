<text x="810" y="233" text-anchor="start" font-size="12" font-style="italic" fill="#444">white → Pi pin 16 · GPIO23</text>
<rect x="700" y="271" width="100" height="30" rx="6" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
