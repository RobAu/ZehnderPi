<text x="500" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
<text x="250" y="175" text-anchor="end" font-size="12" font-style="italic" fill="#444">red → Pi pin 1 · 3.3 V</text>
<line x1="500" y1="228" x2="360" y2="228" stroke="#111" stroke-width="9" stroke-linecap="round"/>
