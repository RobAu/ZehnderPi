<text x="560" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">10</text>
<text x="810" y="407" text-anchor="start" font-size="12" font-style="italic" fill="#444">yellow → Pi pin 19 · GPIO10</text>
<line x1="560" y1="460" x2="700" y2="460" stroke="#111" stroke-width="9" stroke-linecap="round"/>
<line x1="560" y1="460" x2="700" y2="460" stroke="#1d4fc4" stroke-width="6" stroke-linecap="round"/>
<rect x="700" y="445" width="100" height="30" rx="6" fill="#1d4fc4" stroke="#111" stroke-width="1.5"/>
<text x="750" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">CSN</text>
<circle cx="560" cy="460" r="14" fill="#1d4fc4" stroke="#fff" stroke-width="2.5"/>
<text x="560" y="464" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">12</text>
<text x="810" y="465" text-anchor="start" font-size="12" font-style="italic" fill="#444">blue → Pi pin 24 · GPIO8 (CE0)</text>
<rect x="700" y="503" width="100" height="30" rx="6" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="750" y="523" text-anchor="middle" font-size="14" fill="#777">GND</text>
<circle cx="560" cy="518" r="12" fill="#3a3a3a" stroke="#c9a227" stroke-width="2"/>
<text x="560" y="522" text-anchor="middle" font-size="10" fill="#bbb">14</text>
<text x="810" y="523" text-anchor="start" font-size="12" font-style="italic" fill="#444">not connected</text>
<text x="530" y="612" text-anchor="middle" font-size="14" fill="#222">Power the module from 3.3 V only (maximum 3.6 V). uCLK, AM, CD and the second GND pin are not used.</text>
<text x="530" y="636" text-anchor="middle" font-size="13" fill="#555">Module layouts differ between makers: check the labels printed on your board before wiring.</text>
