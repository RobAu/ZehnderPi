<text x="500" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
<text x="250" y="233" text-anchor="end" font-size="12" font-style="italic" fill="#444">purple → Pi pin 22 · GPIO25</text>
