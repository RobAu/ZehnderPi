<text x="500" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">9</text>
<text x="250" y="407" text-anchor="end" font-size="12" font-style="italic" fill="#444">green → Pi pin 21 · GPIO9</text>
