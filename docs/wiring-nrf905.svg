<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="1060" height="660" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1060" height="660" fill="#f6f3ec"/>
<text x="530" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">nRF905 module header (2 × 7)</text>
<text x="530" y="66" text-anchor="middle" font-size="14" fill="#555">Pins as labelled on the common nRF905 breakout · pin 1 = VCC · each wire goes to the Raspberry Pi pin shown</text>
<rect x="430" y="100" width="200" height="458" rx="14" fill="#2e7d4f" stroke="#1d5435" stroke-width="3"/>
<text x="530" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#eaf5ee">nRF905 module</text>
<rect x="472" y="140" width="116" height="408" rx="6" fill="#161616"/>
<line x1="500" y1="170" x2="360" y2="170" stroke="#111" stroke-width="9" stroke-linecap="round"/>
<line x1="500" y1="170" x2="360" y2="170" stroke="#d62828" stroke-width="6" stroke-linecap="round"/>
<rect x="260" y="155" width="100" height="30" rx="6" fill="#d62828" stroke="#111" stroke-width="1.5"/>
<text x="310" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">VCC</text>
