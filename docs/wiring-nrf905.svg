<circle cx="560" cy="344" r="14" fill="#8e9196" stroke="#fff" stroke-width="2.5"/>
<text x="560" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">8</text>
<text x="810" y="349" text-anchor="start" font-size="12" font-style="italic" fill="#444">grey → Pi pin 15 · GPIO22</text>
<line x1="560" y1="402" x2="700" y2="402" stroke="#111" stroke-width="9" stroke-linecap="round"/>
<line x1="560" y1="402" x2="700" y2="402" stroke="#f2d21b" stroke-width="6" stroke-linecap="round"/>
